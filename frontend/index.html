<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI School - 智能学习辅导系统" />
  <meta name="theme-color" content="#0c8ee9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AI School</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; }
    #app { min-height: 100vh; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: #fafafa; transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .load-spinner {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 3px solid #e4e4e7;
      border-top-color: #0c8ee9;
      animation: loadSpin 0.8s linear infinite;
    }
    @keyframes loadSpin { to { transform: rotate(360deg); } }
    .load-text { margin-top: 16px; font-size: 14px; color: #71717a; letter-spacing: 0.3px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <div id="loading">
    <div class="load-spinner"></div>
    <div class="load-text">AI School 加载中...</div>
  </div>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading')?.classList.add('hidden');
      }, 400);
    });
  </script>
</body>
</html>
